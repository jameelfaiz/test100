services:
  - type: web
    name: unified-aicte-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: complaint-evidence
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PERSISTENT_STORAGE_DIR
        value: /opt/render/project/src/backend/uploads/evidence
